name: Test and deploy pilot
on:
  push:
    branches:
      - stable
  workflow_dispatch:
concurrency:
  group: deploy-pilot-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy to pilot VPS
    runs-on: self-hosted
    steps:
      - name: Pull, build and restart
        run: |
          set -euo pipefail
          cd /var/www/pilot
          git fetch origin
          git checkout stable
          git reset --hard origin/stable
          pnpm install --frozen-lockfile
          VITE_ENABLE_ES_PILOT=true pnpm run build
          pm2 restart pilot-web
