name: Bundle Size Budget
on:
  pull_request:
  push:
    branches: [ stable ]
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version resolved from package.json "packageManager" — see PARKING-LOT.md for why
      # a `version:` here conflicts even when it matches packageManager.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec size-limit
